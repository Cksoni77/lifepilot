spring:
  application:
    name: lifepilot-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lifepilot}
    username: ${DATABASE_USERNAME:lifepilot}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:20}
  recommendations:
    priority-weight: ${RECOMMENDATION_PRIORITY_WEIGHT:0.30}
    urgency-weight: ${RECOMMENDATION_URGENCY_WEIGHT:0.30}
    deadline-weight: ${RECOMMENDATION_DEADLINE_WEIGHT:0.20}
    goal-relevance-weight: ${RECOMMENDATION_GOAL_RELEVANCE_WEIGHT:0.20}
